<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お気に入り ｜ 九龍-KOWLOON-</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container">
  <section class="section">
    <div class="section-head">
      <h2>お気に入りの写真</h2>
    </div>
    <div class="photo-grid" id="fav-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <div class="big-emoji">♡</div>
      <p>まだお気に入りに登録した写真がありません。<br>大会ギャラリーの写真にある♥ボタンから登録できます。</p>
      <a class="btn btn-primary" href="archive.html" style="margin-top:14px;">大会アーカイブへ</a>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="前の写真">&#10094;</button>
  <img id="lightbox-img" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="次の写真">&#10095;</button>
</div>

<script src="js/config.js"></script>
<script src="js/favorites.js"></script>
<script src="js/nav.js"></script>
<script src="js/data.js"></script>
<script>
(function () {
  renderHeader("favorites");
  renderFooter();

  const favs = listFavorites();
  const grid = document.getElementById("fav-grid");
  const empty = document.getElementById("empty-state");

  if (favs.length === 0) {
    empty.style.display = "block";
    return;
  }

  grid.innerHTML = favs.map(p => `
    <div class="photo-item" data-full="${p.full}" data-caption="${p.eventName || ""}">
      <img src="${p.thumb}" alt="${p.eventName || ""}" loading="lazy">
      <button class="fav-btn active" data-photo-id="${p.id}">♥</button>
    </div>
  `).join("");

  grid.querySelectorAll(".fav-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleFavorite(btn.dataset.photoId);
      btn.closest(".photo-item").remove();
      if (!grid.querySelector(".photo-item")) {
        empty.style.display = "block";
      }
    });
  });

  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  let currentIndex = -1;

  function showLightbox(index) {
    currentIndex = (index + favs.length) % favs.length;
    const p = favs[currentIndex];
    lightboxImg.src = p.full;
    lightboxImg.alt = p.eventName || "";
  }

  grid.querySelectorAll(".photo-item").forEach((item, index) => {
    item.addEventListener("click", () => {
      showLightbox(index);
      lightbox.classList.add("open");
    });
  });
  document.getElementById("lightbox-prev").addEventListener("click", (e) => {
    e.stopPropagation();
    showLightbox(currentIndex - 1);
  });
  document.getElementById("lightbox-next").addEventListener("click", (e) => {
    e.stopPropagation();
    showLightbox(currentIndex + 1);
  });
  document.getElementById("lightbox-close").addEventListener("click", () => {
    lightbox.classList.remove("open");
  });
  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) lightbox.classList.remove("open");
  });
  document.addEventListener("keydown", (e) => {
    if (!lightbox.classList.contains("open")) return;
    if (e.key === "ArrowLeft") showLightbox(currentIndex - 1);
    if (e.key === "ArrowRight") showLightbox(currentIndex + 1);
    if (e.key === "Escape") lightbox.classList.remove("open");
  });
})();
</script>
</body>
</html>
