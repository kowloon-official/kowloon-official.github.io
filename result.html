<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 結果画像botのリンクからだけ開く隠しページ。検索・ナビ・サイトマップには出さない -->
<meta name="robots" content="noindex, nofollow">
<title>結果画像 ｜ 九龍-KOWLOON-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Anton&display=swap" rel="stylesheet">
<style>
/* Noto Sans（可変フォント）の横幅75%版を「Noto Sans Condensed」として使う。SIL Open Font License 1.1 */
@font-face{font-family:'NotoSansCond75';font-weight:900;font-stretch:75%;src:url(assets/fonts/noto-sans-condensed-900.woff2) format('woff2')}
/* 色は公式サイト（css/style.css）と同じ */
:root{--blue:#0090c9;--cyan:#00ccff;--bg:#fafafa;--surface:#fff;--border:#e6e6ea;--chip:#f3f4f7;--on:#e6f6fc;--text:#1a1a22;--muted:#6b6b78;--radius:14px;--shadow:0 4px 20px rgba(20,20,30,.06)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

.wrap{max-width:1280px;margin:0 auto;padding:20px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.view{position:sticky;top:20px}
#cv{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 80px);margin:0 auto;border-radius:6px;touch-action:none;cursor:grab;box-shadow:0 10px 30px rgba(20,20,30,.18)}
#cv:active{cursor:grabbing}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}

.ctrl{min-width:0;display:grid;gap:14px}
.step{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 18px 20px}
/* 見出しは公式サイトの「section-head h2」と同じ、水色の下線 */
.step h2{display:inline-block;margin:0 0 14px;padding-bottom:5px;border-bottom:3px solid var(--cyan);font-size:15px;font-weight:900}

/* タブ（大会の写真／自分の写真） */
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:var(--chip);border:1px solid transparent;border-radius:999px;padding:7px 0;color:var(--muted);font-weight:700}
.tabs button.on{background:var(--on);border-color:var(--blue);color:var(--blue)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-height:232px;overflow:auto;overscroll-behavior:contain}
.thumbs img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:4px;cursor:pointer;outline:3px solid transparent;outline-offset:-3px}
.thumbs img.on{outline-color:var(--cyan)}
.pick{display:flex;align-items:center;justify-content:center;width:100%;padding:22px 12px;border:1.5px dashed #c9ccd6;border-radius:12px;color:var(--blue);font-weight:700;cursor:pointer;background:var(--chip)}
.pick:hover{border-color:var(--blue)}
.pick input{display:none}
.note{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.6}

/* 見た目の設定 */
.row{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px;margin-bottom:12px}
.row:last-child{margin-bottom:0}
.row>span{color:var(--muted);font-size:12px;font-weight:700}
.seg{display:flex;gap:6px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--chip);border:1px solid transparent;border-radius:10px;padding:8px 6px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--on);border-color:var(--blue);color:var(--blue)}
/* 向き：枠の形 */
.shape{display:inline-block;border:1.6px solid currentColor;border-radius:2px}
.shape.h{width:20px;height:12px}.shape.v{width:12px;height:15px}
/* 文字の位置：四隅のどこに文字が来るか */
.seg.corner button{padding:7px 0}
.cn{position:relative;display:block;width:30px;height:20px;border:1.6px solid currentColor;border-radius:2px}
.cn::after{content:"";position:absolute;width:11px;height:4px;border-radius:1px;background:currentColor}
.cn.tl::after{left:3px;top:3px}.cn.tr::after{right:3px;top:3px}.cn.bl::after{left:3px;bottom:3px}.cn.br::after{right:3px;bottom:3px}
input[type=range]{width:100%;accent-color:var(--blue)}

/* 保存・シェア（ボタンは公式サイトの btn-primary と同じ形） */
.acts{display:flex;gap:8px}
.acts button{flex:1;border-radius:999px;padding:13px 8px;font-weight:700;font-size:15px;border:0;background:var(--blue);color:#fff}
#msg{text-align:center}#msg:empty{display:none}

/* スマホの保存：画像を長押しして写真に保存してもらう */
.saveov{position:fixed;inset:0;z-index:20;background:rgba(10,12,18,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
.saveov img{max-width:100%;max-height:72vh;border-radius:6px;-webkit-touch-callout:default}
.saveov p{margin:0;color:#fff;font-weight:700;text-align:center;line-height:1.7}
.saveov button{border:0;border-radius:999px;padding:10px 28px;background:#fff;color:var(--text);font-weight:700}

.error{max-width:520px;margin:80px auto;padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);line-height:1.9}

/* タブレット・スマホ：プレビューを上に固定して、下の操作を変えながら見られるようにする */
@media (max-width:900px){
  .wrap{grid-template-columns:1fr;gap:0;padding:0 0 32px}
  .view{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 6px;box-shadow:0 8px 14px -10px rgba(20,20,30,.25)}
  #cv{max-height:44vh;box-shadow:none}
  .hint{margin-top:4px;font-size:11px}
  .ctrl{padding:14px 16px 0}
}
@media (min-width:600px) and (max-width:900px){
  #cv{max-height:46vh}
  .ctrl{max-width:640px;margin:0 auto;width:100%}
}
</style>
</head>
<body>
<div class="error" id="error" hidden></div>
<div id="app" hidden>
  <div class="wrap">
    <div class="view">
      <canvas id="cv"></canvas>
      <div class="hint">ドラッグで写真の位置を動かせます</div>
    </div>
    <div class="ctrl">
      <section class="step">
        <h2>写真をえらぶ</h2>
        <div class="tabs seg-src" data-k="src"><button data-v="gallery" class="on">大会の写真</button><button data-v="own">自分の写真</button></div>
        <div id="galBox"><div class="thumbs" id="thumbs"></div><div class="note" id="galNote"></div></div>
        <div id="ownBox" hidden>
          <label class="pick"><input type="file" id="file" accept="image/*">＋ 写真をえらぶ</label>
          <div class="note" id="ownNote">写真はこの端末の中だけで使います（アップロードはされません）</div>
        </div>
      </section>

      <section class="step">
        <h2>見た目を整える</h2>
        <div class="row"><span>向き</span>
          <div class="seg" data-k="ori"><button data-v="h" class="on"><b class="shape h"></b>横</button><button data-v="v"><b class="shape v"></b>縦</button></div></div>
        <div class="row"><span>文字</span>
          <div class="seg corner" data-k="layout"><button data-v="tl" aria-label="左上"><b class="cn tl"></b></button><button data-v="tr" aria-label="右上"><b class="cn tr"></b></button><button data-v="bl" class="on" aria-label="左下"><b class="cn bl"></b></button><button data-v="br" aria-label="右下"><b class="cn br"></b></button></div></div>
        <div class="row"><span>写真の色</span>
          <div class="seg" data-k="tone"><button data-v="mono" class="on">モノクロ</button><button data-v="color">カラー</button></div></div>
        <div class="row"><span>ズーム</span><input type="range" id="zoom" min="1" max="2.5" step="0.01" value="1"></div>
      </section>

      <section class="step">
        <h2 id="actTitle">保存・シェア</h2>
        <div class="acts">
          <button id="save">保存</button>
          <button id="share" hidden>シェア</button>
          <button id="copy" hidden>コピー</button>
        </div>
        <div class="note" id="msg"></div>
      </section>
    </div>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/result.js"></script>
</body>
</html>
