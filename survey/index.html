<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icons/icon-96.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>アンケート | 九龍-KOWLOON-</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap">
<script>
  // 名札のQRの行き先。回答受付が始まったらGASのアンケートへ転送し、それまでは「準備中」を出す。
  // 次の大会: OPEN_AT をその大会の日付に書き換える（GAS側の EVENT も変える。手順は作業メモ.mdの survey-form 節）。
  // 確認用: ?preview を付けると日付に関係なく転送する。
  var SURVEY_URL = "https://script.google.com/macros/s/AKfycbzcDgs5-MQ71ByWDbtRcypwjobKp5fRhBf1_1Ri5I-LFh6TXBz_ViKQDbsGvBA3uray/exec";
  var OPEN_AT = "2026-11-28T00:00:00+09:00";

  if (Date.now() >= new Date(OPEN_AT).getTime() || /[?&]preview\b/.test(location.search)) {
    location.replace(SURVEY_URL);
  }
</script>
<style>
  :root{
    --blue:#0090c9;
    --page:#eef8fc;
    --navy:#0d3a5c;
    --muted:#6b6b78;
    --border:#d3e8f1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;
    background:var(--page);color:var(--navy);
    font-family:'Noto Sans JP','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;
    text-align:center;
  }
  main{max-width:420px;width:100%;}
  .brand{margin:0 0 20px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--blue);}
  h1{margin:0;font-size:24px;font-weight:900;letter-spacing:.04em;line-height:1.4;}
  .btn{
    display:inline-block;margin-top:32px;padding:13px 36px;border-radius:999px;
    background:var(--blue);color:#fff;font-size:15px;font-weight:700;text-decoration:none;
  }
  .btn:hover{background:#007bb0;}
  .go{display:none;margin:14px 0 0;font-size:13px;color:#5a6470;}
  .go a{color:var(--blue);}
</style>
</head>
<body>
<main>
  <p class="brand">九龍-KOWLOON-</p>
  <h1>アンケートは準備中です</h1>
  <a class="btn" href="/">公式サイトへ</a>
  <p class="go" id="go">開かない場合は<a href="#" id="goLink">こちら</a></p>
</main>
<script>
  document.getElementById("goLink").href = SURVEY_URL;
  // 転送中なのにページが残っている場合（転送がブロックされた時など）は手動のリンクを出す
  if (Date.now() >= new Date(OPEN_AT).getTime()) document.getElementById("go").style.display = "block";
</script>
</body>
</html>
