<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大会アーカイブ ｜ 九龍-KOWLOON-</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container">
  <section class="section">
    <div class="section-head">
      <h2>大会アーカイブ</h2>
    </div>
    <div id="archive-groups"></div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/favorites.js"></script>
<script src="js/nav.js"></script>
<script src="js/data.js"></script>
<script>
(async function () {
  renderHeader("archive");
  renderFooter();
  const tournaments = await loadTournaments();
  document.querySelector(".section-head h2").textContent = `大会アーカイブ（全${tournaments.length}件）`;

  const groups = {};
  tournaments.forEach(t => {
    const year = new Date(t.date).getFullYear();
    (groups[year] ||= []).push(t);
  });
  const years = Object.keys(groups).sort((a, b) => b - a);

  document.getElementById("archive-groups").innerHTML = years.map(year => `
    <div class="archive-year-group">
      <h3 class="archive-year">${year}年（${groups[year].length}件）</h3>
      <div class="card-grid">${groups[year].map(eventCardHtml).join("")}</div>
    </div>
  `).join("");
})();
</script>
</body>
</html>
