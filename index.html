<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九龍-KOWLOON- フォトアーカイブ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container">
  <section class="hero">
    <div class="hero-photo" id="hero-photo">
      <div class="hero-placeholder" id="hero-placeholder" style="display:none;">写真準備中</div>
    </div>
    <p class="tagline-banner">最新の九龍が最高の九龍</p>
  </section>

  <section class="section intro-section">
    <div class="section-head">
      <h2>九龍-KOWLOON- とは</h2>
    </div>
    <div class="section-card">
      <p class="intro-text">
        <span class="intro-line">九龍は九州を拠点とする「大乱闘<span class="no-break">スマッシュブラザーズ</span> <span class="no-break">SPECIAL」</span>をメインとした非公式コミュニティ大会です。</span><br>
        <span class="intro-line">初心者から上級者まで楽しめる大会を目指しており、どなたでもお気軽にご参加いただけます。</span><br>
        <span class="intro-line">このサイトでは、これまでの大会の写真をまとめて見返すことができます。</span>
      </p>
    </div>
  </section>

  <section class="section prev-event-section" id="prev-event-section">
    <div class="section-head">
      <h2>前回大会</h2>
    </div>
    <div class="section-card next-event-card" id="prev-event-card">
      <p>読み込み中...</p>
    </div>
  </section>

  <section class="section next-event-section" id="next-event-section">
    <div class="section-head">
      <h2>次回大会予定</h2>
    </div>
    <div id="next-event-list">
      <div class="section-card next-event-card"><p>読み込み中...</p></div>
    </div>
  </section>

  <section class="section stats-section">
    <div class="section-head">
      <h2>大会実績</h2>
    </div>
    <div class="section-card stats-strip" id="stats-strip"></div>
  </section>

  <section class="section thanks-section">
    <div class="section-head">
      <h2>Thanks to</h2>
    </div>
    <div class="section-card">
      <p class="thanks-note">このサイトの写真は、この方たちが撮ってくれました。</p>
      <div class="thanks-list" id="thanks-list"></div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/favorites.js"></script>
<script src="js/nav.js"></script>
<script src="js/data.js"></script>
<script>
(async function () {
  renderHeader("home");
  renderFooter();

  const tournaments = await loadTournaments();

  // ヒーロー: 象徴的な写真が右から左へ流れ続けるフィルムストリップ
  try {
    const heroPhoto = document.getElementById("hero-photo");
    const res = await fetch("data/featured-photos.json");
    const photos = await res.json();
    if (photos.length === 0) {
      document.getElementById("hero-placeholder").style.display = "flex";
    } else if (photos.length === 1) {
      const img = document.createElement("img");
      img.src = photos[0];
      img.alt = "";
      img.className = "hero-static";
      heroPhoto.appendChild(img);
    } else {
      const n = photos.length;
      const track = document.createElement("div");
      track.className = "hero-track";
      // 前後に必ず隣の写真が見えるよう3セット並べ、常に中央のセットを使う
      photos.concat(photos, photos).forEach((src) => {
        const img = document.createElement("img");
        img.src = src;
        img.alt = "";
        track.appendChild(img);
      });
      heroPhoto.appendChild(track);

      const waitForLoad = (img) =>
        img.complete ? Promise.resolve() : new Promise((r) => { img.onload = r; img.onerror = r; });
      await Promise.all(Array.from(track.children).map(waitForLoad));

      const imgs = Array.from(track.children);
      const gap = 16; // .hero-track img の margin-right と合わせる
      let cum = 0;
      const offsets = imgs.map((img) => {
        const w = img.getBoundingClientRect().width;
        const center = cum + w / 2;
        cum += w + gap;
        return center;
      });

      const moveMs = 2000;
      const pauseMs = 2000;
      const centerX = () => heroPhoto.clientWidth / 2;
      const goTo = (index, animate) => {
        track.style.transition = animate ? `transform ${moveMs}ms ease-in-out` : "none";
        track.style.transform = `translateX(${centerX() - offsets[index]}px)`;
        if (!animate) void track.offsetWidth;
      };

      let i = n;
      goTo(i, false);
      setInterval(() => {
        i++;
        goTo(i, true);
        if (i === 2 * n) {
          // 見た目が同じ2セット目先頭に到達したら、静止中に瞬時かつ無音でセット目印を巻き戻す
          setTimeout(() => {
            i = n;
            goTo(i, false);
          }, moveMs);
        }
      }, moveMs + pauseMs);
    }
  } catch (e) {
    document.getElementById("hero-placeholder").style.display = "flex";
  }

  // 前回大会(データは新しい順に並んでいるため先頭が直近開催分)
  const prev = tournaments[0];
  if (prev) {
    const prevThumb = prev.cover
      ? `<img src="${prev.cover}" alt="${prev.name}">`
      : `写真準備中`;
    document.getElementById("prev-event-card").innerHTML = `
      <div class="next-event-name">${prev.name}</div>
      <div class="meta">
        <span>${formatDate(prev.date)}</span>
        <span>参加${prev.attendees}人</span>
      </div>
      <div class="prev-event-thumb">${prevThumb}</div>
      <a class="btn btn-primary" href="event.html?slug=${encodeURIComponent(prev.slug)}" style="margin-top:14px;">写真を見る</a>
    `;
  }

  // 開催実績の数字(本編+スマバト等のコラボ+LIMIT BREAKのみをカウント。OIKOMI/レトロ/Pre等は除く)
  const mainSeries = tournaments.filter(t => t.mainSeries);
  const totalEvents = mainSeries.length;
  const totalAttendees = mainSeries.reduce((sum, t) => sum + (t.attendees || 0), 0);
  const firstDate = new Date(tournaments[tournaments.length - 1].date);
  const today = new Date();
  let ySpan = today.getFullYear() - firstDate.getFullYear();
  let mSpan = today.getMonth() - firstDate.getMonth();
  let dSpan = today.getDate() - firstDate.getDate();
  if (dSpan < 0) {
    mSpan -= 1;
    dSpan += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
  }
  if (mSpan < 0) {
    ySpan -= 1;
    mSpan += 12;
  }

  document.getElementById("stats-strip").innerHTML = `
    <div class="stat-item">
      <div class="stat-number">${totalEvents}</div>
      <div class="stat-label">開催回数</div>
    </div>
    <div class="stat-item">
      <div class="stat-number">${totalAttendees.toLocaleString()}</div>
      <div class="stat-label">累計参加人数</div>
    </div>
    <div class="stat-item">
      <div class="stat-number stat-number--small">${ySpan}年${mSpan}ヶ月${dSpan}日</div>
      <div class="stat-label">開催期間</div>
    </div>
  `;

  // 次回大会予定(複数登録した場合は開催日が近い順に並べる)
  const nextEventList = document.getElementById("next-event-list");
  const emptyNextEventHtml =
    `<div class="section-card next-event-card"><p class="next-event-note">次回の開催は近日発表予定です。DiscordやXでお知らせします。</p></div>`;
  try {
    const res = await fetch("data/next-event.json");
    const data = await res.json();
    const events = (Array.isArray(data) ? data : [data])
      .filter((e) => e.scheduled && e.name)
      .sort((a, b) => {
        // 両方に日程がある場合のみ日付順に並べ、片方でも未定ならdata/next-event.json内の並び順を維持する
        if (a.date && b.date) return new Date(a.date) - new Date(b.date);
        return 0;
      });

    if (events.length === 0) {
      nextEventList.innerHTML = emptyNextEventHtml;
    } else {
      nextEventList.innerHTML = events.map((next) => {
        const dateText = next.dateLabel || (next.date ? formatDate(next.date) : "");
        const rows = [
          ["日程", dateText],
          ["会場", next.venue],
          ["規模", next.scale]
        ].filter(([, value]) => value);
        const bannerInner = next.banner
          ? `<img src="${next.banner}" alt="${next.name}">`
          : `画像準備中`;
        return `
          <div class="section-card next-event-card">
            <div class="next-event-main">
              <div class="next-event-name">${next.name}</div>
              <p class="next-event-note">
                ${rows.map(([label, value]) => `${label}：${value}`).join("<br>")}
              </p>
              ${next.note ? `<p class="next-event-note">${next.note}</p>` : ""}
              ${next.registrationUrl ? `<a class="btn btn-primary" href="${next.registrationUrl}" target="_blank" rel="noopener">エントリー情報を見る</a>` : ""}
            </div>
            <div class="next-event-banner">${bannerInner}</div>
          </div>
        `;
      }).join("");
    }
  } catch (e) {
    nextEventList.innerHTML = emptyNextEventHtml;
  }

  // Thanks to: 写真をご提供いただいたカメラマンの一覧(X/Twitterへのリンク付き)
  try {
    const [names, links] = await Promise.all([
      fetch("data/photographers.json").then(r => r.json()),
      fetch("data/photographer-links.json").then(r => r.json()).catch(() => ({}))
    ]);
    document.getElementById("thanks-list").innerHTML = names.map((name) => {
      const url = links[name];
      return url
        ? `<a class="thanks-name" href="${url}" target="_blank" rel="noopener">${name}</a>`
        : `<span class="thanks-name">${name}</span>`;
    }).join(`<span class="thanks-sep">・</span>`);
  } catch (e) {
    document.querySelector(".thanks-section").style.display = "none";
  }
})();
</script>
</body>
</html>
