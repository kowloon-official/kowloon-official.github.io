<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大会ギャラリー ｜ 九龍-KOWLOON-</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container">
  <section class="section">
    <a href="archive.html" class="back-link" id="back-link">&laquo; 大会アーカイブに戻る</a>
    <div class="section-head">
      <h2 id="event-title">読み込み中...</h2>
    </div>
    <p class="meta" id="event-meta" style="color:var(--muted); margin-top:-10px;"></p>
    <div class="photographer-filter" id="photographer-filter"></div>
    <div class="photo-grid" id="photo-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <div class="big-emoji" id="empty-state-emoji">📷</div>
      <p id="empty-state-text">この大会の写真はまだ準備中です。</p>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="前の写真">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><polyline points="85,20 75,50 85,80"></polyline><polyline points="58,20 48,50 58,80"></polyline></svg>
  </button>
  <img id="lightbox-img" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="次の写真">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,20 25,50 15,80"></polyline><polyline points="42,20 52,50 42,80"></polyline></svg>
  </button>
</div>

<script src="js/config.js"></script>
<script src="js/favorites.js"></script>
<script src="js/nav.js"></script>
<script src="js/data.js"></script>
<script>
(async function () {
  renderHeader("archive");
  renderFooter();

  // アーカイブ一覧からの遷移ならブラウザの「戻る」で絞り込み状態を維持する
  if (document.referrer && document.referrer.includes("archive.html")) {
    document.getElementById("back-link").addEventListener("click", (e) => {
      e.preventDefault();
      history.back();
    });
  }

  const params = new URLSearchParams(location.search);
  const slug = params.get("slug");
  const tournaments = await loadTournaments();
  const event = tournaments.find(t => t.slug === slug);

  if (!event) {
    document.getElementById("event-title").textContent = "大会が見つかりませんでした";
    return;
  }

  document.title = `${event.name} ｜ 九龍-KOWLOON-`;
  document.getElementById("event-title").textContent = event.name;
  document.getElementById("event-meta").textContent =
    `${formatDate(event.date)} ・ 参加${event.attendees}人`;

  const manifest = await loadPhotoManifest(event.photoManifest);
  const grid = document.getElementById("photo-grid");
  const empty = document.getElementById("empty-state");
  const photographerFilterEl = document.getElementById("photographer-filter");

  if (!manifest.photos || manifest.photos.length === 0) {
    if (event.noPhotographer) {
      document.getElementById("empty-state-emoji").textContent = "🚫";
      document.getElementById("empty-state-text").textContent = "この大会はカメラマンが不在だったため、写真はありません。";
    }
    empty.style.display = "block";
    return;
  }

  // カメラマン絞り込み(2人以上いる大会のみ表示。1人だけの場合は撮影者名をメタ情報に添える)
  const photographers = [...new Set(manifest.photos.map(p => p.photographer).filter(Boolean))];
  let activePhotographer = null;
  let currentPhotos = manifest.photos;

  if (photographers.length === 1) {
    document.getElementById("event-meta").textContent += ` ・ 撮影: ${photographers[0]}`;
  } else if (photographers.length >= 2) {
    const counts = {};
    manifest.photos.forEach(p => { counts[p.photographer] = (counts[p.photographer] || 0) + 1; });
    const pills = [{ name: "", label: `すべて (${manifest.photos.length})` }]
      .concat(photographers.map(name => ({ name, label: `${name} (${counts[name]})` })));
    photographerFilterEl.innerHTML = pills.map(p => `
      <button type="button" class="photographer-pill${p.name === "" ? " active" : ""}" data-name="${p.name}">${p.label}</button>
    `).join("");
    photographerFilterEl.querySelectorAll(".photographer-pill").forEach(btn => {
      btn.addEventListener("click", () => {
        activePhotographer = btn.dataset.name || null;
        photographerFilterEl.querySelectorAll(".photographer-pill").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderGrid();
      });
    });
  }

  // ライトボックス(拡大表示・矢印/スワイプで前後の写真に移動)
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  let currentIndex = -1;

  function showLightbox(index) {
    currentIndex = (index + currentPhotos.length) % currentPhotos.length;
    const p = currentPhotos[currentIndex];
    lightboxImg.src = p.full;
    lightboxImg.alt = p.caption || event.name;
  }

  function renderGrid() {
    currentPhotos = activePhotographer
      ? manifest.photos.filter(p => p.photographer === activePhotographer)
      : manifest.photos;

    grid.innerHTML = currentPhotos.map(p => `
      <div class="photo-item" data-full="${p.full}" data-caption="${p.caption || ""}">
        <img src="${p.thumb}" alt="${p.caption || event.name}" loading="lazy">
        <button class="fav-btn ${isFavorite(p.id) ? "active" : ""}" data-photo-id="${p.id}">♥</button>
      </div>
    `).join("");

    // お気に入りボタン
    grid.querySelectorAll(".fav-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const photoId = btn.dataset.photoId;
        const photo = currentPhotos.find(p => p.id === photoId);
        const nowActive = toggleFavorite(photoId, {
          id: photoId,
          thumb: photo.thumb,
          full: photo.full,
          eventName: event.name,
          eventSlug: event.slug
        });
        btn.classList.toggle("active", nowActive);
      });
    });

    grid.querySelectorAll(".photo-item").forEach((item, index) => {
      item.addEventListener("click", () => {
        showLightbox(index);
        lightbox.classList.add("open");
      });
    });
  }

  renderGrid();
  document.getElementById("lightbox-prev").addEventListener("click", (e) => {
    e.stopPropagation();
    showLightbox(currentIndex - 1);
  });
  document.getElementById("lightbox-next").addEventListener("click", (e) => {
    e.stopPropagation();
    showLightbox(currentIndex + 1);
  });
  document.getElementById("lightbox-close").addEventListener("click", () => {
    lightbox.classList.remove("open");
  });
  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) lightbox.classList.remove("open");
  });
  document.addEventListener("keydown", (e) => {
    if (!lightbox.classList.contains("open")) return;
    if (e.key === "ArrowLeft") showLightbox(currentIndex - 1);
    if (e.key === "ArrowRight") showLightbox(currentIndex + 1);
    if (e.key === "Escape") lightbox.classList.remove("open");
  });

  // スマホ用: 左右スワイプで前後の写真に移動
  let touchStartX = 0;
  let touchStartY = 0;
  lightbox.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });
  lightbox.addEventListener("touchend", (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    showLightbox(dx < 0 ? currentIndex + 1 : currentIndex - 1);
  }, { passive: true });
})();
</script>
</body>
</html>
