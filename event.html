<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大会ギャラリー ｜ 九龍-KOWLOON-</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<main class="container">
  <section class="section">
    <div class="section-head">
      <h2 id="event-title">読み込み中...</h2>
    </div>
    <p class="meta" id="event-meta" style="color:var(--muted); margin-top:-10px;"></p>
    <div class="photo-grid" id="photo-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <div class="big-emoji">📷</div>
      <p>この大会の写真はまだ準備中です。</p>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="前の写真">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><polyline points="80,18 22,50 80,82"></polyline></svg>
  </button>
  <img id="lightbox-img" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="次の写真">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><polyline points="20,18 78,50 20,82"></polyline></svg>
  </button>
</div>

<script src="js/config.js"></script>
<script src="js/favorites.js"></script>
<script src="js/nav.js"></script>
<script src="js/data.js"></script>
<script>
(async function () {
  renderHeader("archive");
  renderFooter();

  const params = new URLSearchParams(location.search);
  const slug = params.get("slug");
  const tournaments = await loadTournaments();
  const event = tournaments.find(t => t.slug === slug);

  if (!event) {
    document.getElementById("event-title").textContent = "大会が見つかりませんでした";
    return;
  }

  document.title = `${event.name} ｜ 九龍-KOWLOON-`;
  document.getElementById("event-title").textContent = event.name;
  document.getElementById("event-meta").textContent =
    `${formatDate(event.date)} ・ 参加${event.attendees}人`;

  const manifest = await loadPhotoManifest(event.photoManifest);
  const grid = document.getElementById("photo-grid");
  const empty = document.getElementById("empty-state");

  if (!manifest.photos || manifest.photos.length === 0) {
    empty.style.display = "block";
    return;
  }

  grid.innerHTML = manifest.photos.map(p => `
    <div class="photo-item" data-full="${p.full}" data-caption="${p.caption || ""}">
      <img src="${p.thumb}" alt="${p.caption || event.name}" loading="lazy">
      <button class="fav-btn ${isFavorite(p.id) ? "active" : ""}" data-photo-id="${p.id}">♥</button>
    </div>
  `).join("");

  // お気に入りボタン
  grid.querySelectorAll(".fav-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const photoId = btn.dataset.photoId;
      const photo = manifest.photos.find(p => p.id === photoId);
      const nowActive = toggleFavorite(photoId, {
        id: photoId,
        thumb: photo.thumb,
        full: photo.full,
        eventName: event.name,
        eventSlug: event.slug
      });
      btn.classList.toggle("active", nowActive);
    });
  });

  // ライトボックス(拡大表示・矢印で前後の写真に移動)
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  let currentIndex = -1;

  function showLightbox(index) {
    currentIndex = (index + manifest.photos.length) % manifest.photos.length;
    const p = manifest.photos[currentIndex];
    lightboxImg.src = p.full;
    lightboxImg.alt = p.caption || event.name;
  }

  grid.querySelectorAll(".photo-item").forEach((item, index) => {
    item.addEventListener("click", () => {
      showLightbox(index);
      lightbox.classList.add("open");
    });
  });
  document.getElementById("lightbox-prev").addEventListener("click", (e) => {
    e.stopPropagation();
    showLightbox(currentIndex - 1);
  });
  document.getElementById("lightbox-next").addEventListener("click", (e) => {
    e.stopPropagation();
    showLightbox(currentIndex + 1);
  });
  document.getElementById("lightbox-close").addEventListener("click", () => {
    lightbox.classList.remove("open");
  });
  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) lightbox.classList.remove("open");
  });
  document.addEventListener("keydown", (e) => {
    if (!lightbox.classList.contains("open")) return;
    if (e.key === "ArrowLeft") showLightbox(currentIndex - 1);
    if (e.key === "ArrowRight") showLightbox(currentIndex + 1);
    if (e.key === "Escape") lightbox.classList.remove("open");
  });
})();
</script>
</body>
</html>
